name: Export Nature TFLite models
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/export-requirements.txt
      - run: python tools/export_openimages_tflite.py
      - uses: actions/upload-artifact@v4
        with:
          name: fungi-radar-openimages-tflite
          path: exports/*.tflite
